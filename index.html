<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pizzeria Ensen</title>
  <meta name="description" content="Doses de pâte à pizza napolitaine pour chaque fournée, à partir des recettes de Pizza App.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4efe8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pizzeria Ensen">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Thème choisi à la main, appliqué avant l'affichage (pas d'éclair clair/sombre).
    try {
      var theme = localStorage.getItem('pizzeria-theme');
      if (theme === 'clair' || theme === 'sombre') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="avec-onglets">
  <div id="app">
    <header id="entete"></header>
    <div id="maj" class="banniere banniere-maj" role="status" hidden></div>
    <main id="vue" tabindex="-1"></main>
    <div id="barre-actions"></div>
    <button type="button" id="bouton-plus" data-action="ajouter-recette" aria-label="Ajouter une recette">
      <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15"/></svg>
    </button>
    <nav id="onglets" aria-label="Navigation principale">
      <a href="#/" data-onglet="fournee">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21.5 3.2 7.4a17 17 0 0 1 17.6 0Z"/><path d="M5 10.3a13.5 13.5 0 0 1 14 0"/><circle cx="10" cy="13" r="1.3"/><circle cx="14" cy="14.6" r="1.3"/><circle cx="12" cy="17.7" r="1"/></svg>
        <span>Fournée</span>
      </a>
      <a href="#/recettes" data-onglet="recettes">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        <span>Recettes</span>
      </a>
      <a href="#/carnet" data-onglet="carnet">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
        <span>Carnet</span>
      </a>
      <a href="#/reglages" data-onglet="reglages">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        <span>Réglages</span>
      </a>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="feuille" aria-label="Panneau"></dialog>
  <noscript><p style="padding:24px">Pizzeria Ensen a besoin de JavaScript pour fonctionner.</p></noscript>
</body>
</html>
